<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection closed notices in AI Studio cloud iframe environment
      (function() {
        var isViteWs = function(str) {
          return typeof str === 'string' && (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('vite:ws') !== -1);
        };
        window.addEventListener('error', function(event) {
          if (isViteWs(event && event.message) || (event && event.filename && isViteWs(event.filename))) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var r = event && event.reason;
          var msg = (r && (r.message || r.stack)) || '';
          if (isViteWs(msg)) {
            event.stopImmediatePropagation && event.stopImmediatePropagation();
            event.preventDefault && event.preventDefault();
          }
        }, true);
      })();
    </script>
